sources:
  - name: adventure_works
    description: Sistema de banco de dados transacional da Adventure Works contendo dados de vendas, produtos, clientes e localidades.
    database: fea_academy
    schema: adventure_works
    tables:
      - name: sales_salesorderheader
        description: Tabela bruta com o cabeçalho dos pedidos de vendas (informações gerais do pedido).
        columns:
          - name: salesorderid
            description: Chave primária da tabela sales_salesorderheader.
            data_tests:
              - unique
              - not_null

      - name: sales_salesorderdetail
        description: Tabela bruta com os itens detalhados de cada pedido de venda.
        columns:
          - name: salesorderdetailid
            description: Chave primária da tabela sales_salesorderdetail.
            data_tests:
              - unique
              - not_null

      - name: production_product
        description: Tabela bruta contendo o cadastro de produtos da empresa.
        columns:
          - name: productid
            description: Chave primária da tabela production_product.
            data_tests:
              - unique
              - not_null

      - name: production_productsubcategory
        description: Subcategorias dos produtos.
        columns:
          - name: productsubcategoryid
            description: Chave primária da tabela production_productsubcategory.
            data_tests:
              - unique
              - not_null

      - name: production_productcategory
        description: Categorias macro dos produtos.
        columns:
          - name: productcategoryid
            description: Chave primária da tabela production_productcategory.
            data_tests:
              - unique
              - not_null

      - name: sales_customer
        description: Tabela que vincula os clientes às suas respectivas lojas ou pessoas físicas.
        columns:
          - name: customerid
            description: Chave primária da tabela sales_customer.
            data_tests:
              - unique
              - not_null

      - name: person_person
        description: Informações de pessoas físicas (nomes de clientes e funcionários).
        columns:
          - name: businessentityid
            description: Chave primária da tabela person_person.
            data_tests:
              - unique
              - not_null

      - name: sales_store
        description: Informações sobre as lojas parceiras ou de revenda.
        columns:
          - name: businessentityid
            description: Chave primária da tabela sales_store.
            data_tests:
              - unique
              - not_null

      - name: person_address
        description: Tabela bruta de endereços físicos.
        columns:
          - name: addressid
            description: Chave primária da tabela person_address.
            data_tests:
              - unique
              - not_null

      - name: person_stateprovince
        description: Estados e províncias vinculados aos endereços.
        columns:
          - name: stateprovinceid
            description: Chave primária da tabela person_stateprovince.
            data_tests:
              - unique
              - not_null

      - name: person_countryregion
        description: Países e regiões globais.
        columns:
          - name: countryregioncode
            description: Chave primária da tabela person_countryregion.
            data_tests:
              - unique
              - not_null

      - name: sales_creditcard
        description: Tabela bruta contendo informações de cartões de crédito utilizados nas compras.
        columns:
          - name: creditcardid
            description: Chave primária da tabela sales_creditcard.
            data_tests:
              - unique
              - not_null

      - name: sales_salesorderheadersalesreason
        description: Tabela ponte que conecta os pedidos de vendas aos seus respectivos motivos.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - salesorderid
                  - salesreasonid

      - name: sales_salesreason
        description: Cadastro com a descrição dos motivos de venda.
        columns:
          - name: salesreasonid
            description: Chave primária da tabela sales_salesreason.
            data_tests:
              - unique
              - not_null
